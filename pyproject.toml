[project]
name = "periscope-planner"
readme = "README.md"
authors = [
    { name = "Colin Orion Chandler", email = "orion@nau.edu" }
]
description = "Dash observation-planning tool for minor-planet elevation and true-anomaly filtering."
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = ["astroquery", "dash", "numpy", "pandas", "plotly", "requests"]

[project.urls]
"Source Code" = "https://github.com/ColinOrionChandler/PeriScope"

# On a mac, install optional dependencies with `pip install '.[dev]'` (include the single quotes)
[project.optional-dependencies]
test = ["pytest"]
docs = ["sphinx>=7", "sphinx-autoapi>=3", "sphinx-rtd-theme>=3", "sphinx-copybutton"]
dev = [
    "build",
    "twine",
    "pre-commit", # Used to run checks before finalizing a git commit
    "pytest",
    "pytest-cov", # Used to report total code coverage
    "ruff==0.17.0", # Match the pre-commit hook revision
]

[project.scripts]
periscope = "periscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["periscope*"]

[tool.setuptools.package-data]
periscope = ["py.typed", "target_lists/*.lst"]

[build-system]
requires = [
    "setuptools>=68", # Used to build and package the Python project
    "setuptools_scm>=8", # Gets release version from git. Makes it available programmatically
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/periscope/_version.py"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "src",
    "docs",
]
addopts = "--doctest-modules --doctest-glob=*.rst"
log_cli_level = "INFO"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["src/periscope/_version.py", "docs/autoapi", "docs/build"]
[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    "W",
    # Pyflakes
    "F",
    # pep8-naming
    "N",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # docstrings
    "D101",
    "D102",
    "D103",
    "D106",
    "D206",
    "D207",
    "D208",
    "D300",
    "D417",
    "D419",
    # Numpy v2.0 compatibility
    "NPY201",
]
ignore = [
    "UP006", # Allow non standard library generics in type hints
    "UP007", # Allow Union in type hints
    "SIM114", # Allow if with same arms
    "B028", # Allow default warning level
    "SIM117", # Allow nested with
    "UP015", # Allow redundant open parameters
    "UP028", # Allow yield in for loop
]


[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103"]

[tool.coverage.run]
omit = ["src/periscope/_version.py"]
